<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LifeVault — Personal Life Manager</title>
    <meta name="description" content="Securely manage documents, subscriptions, expenses and appointments in one place." />
    <meta name="theme-color" content="#17294d" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="LifeVault" />
    <meta property="og:description" content="Your documents, payments and appointments — organised." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Suppress generic "Script error." reports that originate from
      // cross-origin scripts injected by the preview/iframe environment.
      // These have no filename, line 0, col 0 — the browser hides the
      // real details under same-origin policy. They are never from app
      // code (app scripts are same-origin with crossorigin attribute).
      (function () {
        var isCrossOriginError = function (msg, filename, lineno) {
          return (
            (typeof msg === 'string' && msg.toLowerCase() === 'script error.') ||
            (lineno === 0 && (!filename || filename === ''))
          );
        };
        window.addEventListener('error', function (e) {
          if (isCrossOriginError(e.message, e.filename, e.lineno)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg =
            reason instanceof Error ? reason.message :
            typeof reason === 'string' ? reason : '';
          if (msg && msg.toLowerCase() === 'script error.') {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
